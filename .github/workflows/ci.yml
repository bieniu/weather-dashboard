name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-backend:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          activate-environment: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check backend

      - name: Check formatting
        run: uv run ruff format --check backend

      - name: Check types
        run: uv run ty check backend

      - name: Run prek
        run: |
          uv run prek run \
            end-of-file-fixer \
            trailing-whitespace \
            check-added-large-files \
            check-yaml \
            check-json \
            check-toml \
            mixed-line-ending \
            --all-files

  lint-frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npx eslint frontend/

      - name: Lint CSS
        run: npx stylelint "frontend/**/*.css"

      - name: Check formatting
        run: npx prettier --check "frontend/**/*.{js,css,html}" "tests/frontend/**/*.js"


  test-backend:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          activate-environment: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen --group test

      - name: Run tests
        run: uv run pytest tests --timeout=10 --cov=backend --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend

  test-frontend:
    name: Frontend Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: frontend

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: weather-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        # Starts the container without a reachable MQTT broker (the listener keeps
        # retrying, so the app stays up) and waits for the Dockerfile HEALTHCHECK
        # to report healthy. This exercises the non-root user, the /data volume,
        # the venv PATH and the healthcheck command itself. Only the probe timing
        # is overridden here so CI does not wait for the production 30 s interval.
        run: |
          docker run --detach --name weather-dashboard \
            --health-interval=5s --health-start-period=5s \
            --env MQTT_BROKER=127.0.0.1 --env MQTT_USER=ci --env MQTT_PASSWORD=ci \
            weather-dashboard:ci
          status=starting
          for _ in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Running}}' weather-dashboard)" != "true" ]; then
              status=exited
              break
            fi
            status=$(docker inspect \
              --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
              weather-dashboard)
            case "$status" in healthy|unhealthy|no-healthcheck) break ;; esac
            sleep 3
          done
          if [ "$status" != "healthy" ]; then
            echo "::error::container did not become healthy (status: $status)"
            exit 1
          fi

      - name: Show container logs
        if: always()
        run: docker logs weather-dashboard 2>&1 || true
