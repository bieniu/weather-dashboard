repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.84
    hooks:
      - id: ty
  - repo: builtin
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: mixed-line-ending
      - id: no-commit-to-branch
        args:
          - --branch=master
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: pretty-format-json
        args:
          - --no-sort-keys
          - --indent=4
          - --autofix
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.11.0
    hooks:
      - id: eslint
        args: [--config, eslint.config.js]
        files: \.(js|mjs)$
        exclude: ^frontend/vendor/
        additional_dependencies:
          - eslint@10.11.0
          - '@eslint/js@10.0.1'
          - globals@17.12.0
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^(frontend|tests/frontend)/.*\.(js|css|html)$
        additional_dependencies:
          - prettier@3.9.8
  - repo: https://github.com/thibaudcolas/pre-commit-stylelint
    rev: v17.15.0
    hooks:
      - id: stylelint
        files: \.(css)$
        additional_dependencies:
          - stylelint@17.15.0
          - stylelint-config-standard
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=tekst,nd,crasher
          - --skip="./.*"
          - --quiet-level=2
        exclude: ^frontend/vendor/
        exclude_types: [csv, json]
  - repo: local
    hooks:
      - id: vendor-check
        name: vendored frontend bundles match node_modules
        entry: node scripts/vendor.mjs --check
        language: system
        pass_filenames: false
        files: ^(frontend/vendor/|package(-lock)?\.json$|scripts/vendor\.mjs$)
